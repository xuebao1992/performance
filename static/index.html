// ============ API层（飞书多维表格后端） ============
const API_BASE = '';  // 同源部署，留空即可

async function apiGetScores(month) {
  try {
    const resp = await fetch(`${API_BASE}/api/scores?month=${encodeURIComponent(month)}`);
    const data = await resp.json();
    return data.scores || {};
  } catch(e) {
    console.error('从飞书加载数据失败:', e);
    return null;
  }
}

async function apiSaveScore(month, empId, empName, score) {
  try {
    const resp = await fetch(`${API_BASE}/api/score`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({month, emp_id: empId, emp_name: empName, score})
    });
    const data = await resp.json();
    return data.success;
  } catch(e) {
    console.error('保存到飞书失败:', e);
    return false;
  }
}

// 同步当前月份所有数据到飞书（异步，不阻塞UI）
let syncTimer = null;
function syncToCloud() {
  if (!currentMonth || !appData || !appData.monthlyData[currentMonth]) return;
  const statusEl = document.getElementById('syncStatus');
  if (statusEl) statusEl.textContent = '⏳ 同步中...';
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    const monthData = appData.monthlyData[currentMonth];
    for (const empId in monthData) {
      const emp = appData.employees.find(e => e.id === empId);
      if (emp) {
        await apiSaveScore(currentMonth, empId, emp.name, monthData[empId]);
      }
    }
    if (statusEl) statusEl.textContent = '✓ 数据已同步到飞书';
    console.log('已同步到飞书:', currentMonth);
  }, 1000);  // 1秒防抖
}

// 从飞书加载指定月份的数据
async function loadMonthFromCloud(month) {
  const cloudData = await apiGetScores(month);
  if (cloudData !== null) {
    if (!appData.monthlyData[month]) appData.monthlyData[month] = {};
    for (const empId in cloudData) {
      const data = cloudData[empId] || {};
      if (!data.items) data.items = {};
      if (!data.bonuses) data.bonuses = {};
      appData.monthlyData[month][empId] = data;
    }
    saveData();
  }
}

let appData = null;
let currentMonth = null;
let currentPage = 'dashboard';
let charts = {};

function loadData() {
  const saved = localStorage.getItem('xuebao_performance_data');
  if (saved) {
    try {
      const local = JSON.parse(saved);
      appData = {};
      // 模板总是使用最新版本（随HTML更新）
      appData.templates = DEFAULT_DATA.templates;
      // 员工优先使用本地修改，没有则用默认
      appData.employees = local.employees || DEFAULT_DATA.employees;
      // 月度评分数据从本地加载
      appData.monthlyData = local.monthlyData || {};
    } catch(e) {
      appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
      appData.monthlyData = {};
    }
  } else {
    appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
    appData.monthlyData = {};
  }
}

function saveData() {
  localStorage.setItem('xuebao_performance_data', JSON.stringify(appData));
  syncToCloud();
}

function getMonthData(month) {
  if (!appData.monthlyData[month]) {
    appData.monthlyData[month] = {};
  }
  return appData.monthlyData[month];
}

function getEmpScore(month, empId) {
  const md = getMonthData(month);
  if (!md[empId]) {
    md[empId] = { items: {}, bonuses: {} };
  }
  if (!md[empId].items) md[empId].items = {};
  if (!md[empId].bonuses) md[empId].bonuses = {};
  return md[empId];
}

// 根据岗位和考核月份获取对应版本的模板
function getTemplate(templateKey, month) {
  const tpl = appData.templates[templateKey];
  if (!tpl) return null;
  if (!tpl.versions || tpl.versions.length === 0) return tpl;
  // 找到effectiveMonth <= month的最新版本
  const valid = tpl.versions.filter(v => v.effectiveMonth <= month);
  if (valid.length === 0) return tpl.versions[0];
  return valid[valid.length - 1];
}

function calcEmpScore(emp, month) {
  const template = getTemplate(emp.templateKey, month);
  if (!template) return { total: 0, selfTotal: 0, supTotal: 0, dirTotal: 0, itemScores: [] };
  const w = template.weights;
  const score = getEmpScore(month, emp.id);
  let selfTotal = 0, supTotal = 0, dirTotal = 0, total = 0;
  const itemScores = [];
  
  template.categories.forEach(cat => {
    cat.items.forEach(item => {
      const s = score.items[item.id] || {};
      const sv = parseFloat(s.self) || 0;
      const uv = parseFloat(s.supervisor) || 0;
      const dv = parseFloat(s.director) || 0;
      const weighted = sv * w.self + uv * w.supervisor + dv * w.director;
      selfTotal += sv;
      supTotal += uv;
      dirTotal += dv;
      total += weighted;
      itemScores.push({ ...item, self: sv, supervisor: uv, director: dv, weighted: Math.round(weighted*100)/100 });
    });
  });
  
  template.bonuses.forEach(item => {
    const s = score.bonuses[item.id] || {};
    const sv = parseFloat(s.self) || 0;
    const uv = parseFloat(s.supervisor) || 0;
    const dv = parseFloat(s.director) || 0;
    const weighted = sv * w.self + uv * w.supervisor + dv * w.director;
    selfTotal += sv;
    supTotal += uv;
    dirTotal += dv;
    total += weighted;
    itemScores.push({ ...item, self: sv, supervisor: uv, director: dv, weighted: Math.round(weighted*100)/100, isBonus: true });
  });
  
  return {
    total: Math.round(total * 100) / 100,
    selfTotal: Math.round(selfTotal * 100) / 100,
    supTotal: Math.round(supTotal * 100) / 100,
    dirTotal: Math.round(dirTotal * 100) / 100,
    itemScores,
    weights: w
  };
}

function getEmpStatus(emp, month) {
  const template = getTemplate(emp.templateKey, month);
  if (!template) return { self: false, supervisor: false, director: false, all: false };
  const score = getEmpScore(month, emp.id);
  const allItems = [...template.categories.flatMap(c => c.items), ...template.bonuses];
  let selfDone = true, supDone = true, dirDone = true;
  allItems.forEach(item => {
    const s = score.items[item.id] || score.bonuses[item.id] || {};
    if (s.self === undefined || s.self === '' || s.self === null) selfDone = false;
    if (s.supervisor === undefined || s.supervisor === '' || s.supervisor === null) supDone = false;
    if (s.director === undefined || s.director === '' || s.director === null) dirDone = false;
  });
  return { self: selfDone, supervisor: supDone, director: dirDone, all: selfDone && supDone && dirDone };
}

// ============ 月份管理 ============
function getAvailableMonths() {
  const now = new Date();
  const startYear = 2026, startMonth = 7; // 2026-08，0-indexed
  const endYear = now.getFullYear();
  const endMonth = now.getMonth() - 1; // 考核月份=当前月份-1，0-indexed
  const months = [];
  let y = startYear, m = startMonth;
  while (y < endYear || (y === endYear && m <= endMonth)) {
    months.push(y + '-' + String(m + 1).padStart(2, '0'));
    m++;
    if (m > 11) { m = 0; y++; }
  }
  return months.reverse(); // 最新的在前面
}

function initMonths() {
  const selector = document.getElementById('monthSelector');
  const months = getAvailableMonths();
  selector.innerHTML = months.map(m => `<option value="${m}">${m}</option>`).join('');
  currentMonth = months[0];
  selector.value = currentMonth;
  loadMonthFromCloud(currentMonth);
  selector.addEventListener('change', () => {
    currentMonth = selector.value;
  loadMonthFromCloud(currentMonth);
    renderPage();
  });
}

  `;
  
  // 渲染图表
  if (scoreList.length > 0) {
    setTimeout(() => {
      const ctx = document.getElementById('scoreChart');
      if (ctx) {
        if (charts.score) charts.score.destroy();
        const bins = [0,0,0,0,0,0]; // <60, 60-70, 70-80, 80-90, 90-100, >100
        scoreList.forEach(s => {
          if (s < 60) bins[0]++;
          else if (s < 70) bins[1]++;
          else if (s < 80) bins[2]++;
          else if (s < 90) bins[3]++;
          else if (s <= 100) bins[4]++;
          else bins[5]++;
        });
        charts.score = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['<60分', '60-70分', '70-80分', '80-90分', '90-100分', '>100分'],

              label: '人数',
              data: bins,
              backgroundColor: ['#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#8b5cf6'],
              borderRadius: 6
            }]
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
          }
        });
      }
    }, 100);
  }
}

function updateScoreLive(input, itemId, field, isBonus, max) {
  let val = parseFloat(input.value);
  if (isNaN(val)) val = 0;
  if (val > max) { val = max; input.value = max; }
  if (val < 0) { val = 0; input.value = 0; }
  const score = getEmpScore(currentMonth, editingEmpId);
  const target = isBonus ? score.bonuses : score.items;
  if (!target[itemId]) target[itemId] = {};
  target[itemId][field] = input.value === '' ? '' : val;
  recalcModal();
}

function updateScore(itemId, field, value, isBonus) {
  const score = getEmpScore(currentMonth, editingEmpId);
  const target = isBonus ? score.bonuses : score.items;
  if (!target[itemId]) target[itemId] = {};
  target[itemId][field] = value === '' ? '' : parseFloat(value);
  saveData();
  recalcModal();
}

function updateRemark(itemId, value, isBonus) {
  const score = getEmpScore(currentMonth, editingEmpId);
  const target = isBonus ? score.bonuses : score.items;
  if (!target[itemId]) target[itemId] = {};
  target[itemId].remark = value;
  saveData();
}

// 把考核标准中的连续空格渲染成可填写的输入框
function renderStandard(standard, itemId, isBonus) {
  const score = getEmpScore(currentMonth, editingEmpId);
  const target = isBonus ? score.bonuses : score.items;
  if (!target[itemId]) target[itemId] = {};
  if (!target[itemId].fields) target[itemId].fields = [];
  
  let fieldIndex = 0;
  return standard.replace(/[ _]{3,}/g, (match) => {
    const idx = fieldIndex++;
    const val = target[itemId].fields[idx] || '';
    const w = Math.min(match.length * 8, 100);
    return `<input type="text" class="data-input inline-block border-b border-blue-400 bg-blue-50 px-1 text-center text-xs focus:outline-none focus:border-blue-600 focus:bg-blue-100" style="width:${w}px;min-width:50px;" value="${val.replace(/"/g, '&quot;')}" placeholder="填写" onchange="updateDataField('${itemId}',${idx},this.value,${isBonus})">`;
  });
}

function updateDataField(itemId, fieldIdx, value, isBonus) {
  const score = getEmpScore(currentMonth, editingEmpId);
  const target = isBonus ? score.bonuses : score.items;
  if (!target[itemId]) target[itemId] = {};
  if (!target[itemId].fields) target[itemId].fields = [];
  target[itemId].fields[fieldIdx] = value;
  saveData();
}

function recalcModal() {
  const emp = appData.employees.find(e => e.id === editingEmpId);
  const calc = calcEmpScore(emp, currentMonth);
  calc.itemScores.forEach(item => {
    const el = document.getElementById('weighted-' + item.id);
    if (el) el.textContent = item.weighted.toFixed(1);
  });
  const totalEl = document.getElementById('modalTotal');
  if (totalEl) totalEl.textContent = calc.total.toFixed(1);
  const selfEl = document.getElementById('modalSelfTotal');
  if (selfEl) selfEl.textContent = calc.selfTotal.toFixed(1);
  const supEl = document.getElementById('modalSupTotal');
  if (supEl) supEl.textContent = calc.supTotal.toFixed(1);
  const dirEl = document.getElementById('modalDirTotal');
  if (dirEl) dirEl.textContent = calc.dirTotal.toFixed(1);
}

function closeScoreEditor() {
  const modal = document.getElementById('scoreModal');
  if (modal) modal.remove();
  saveData();
  renderPage();
}

function saveAndClose() {
  saveData();
  closeScoreEditor();
}

// ============ 数据汇总 ============
function renderSummary() {
  const content = document.getElementById('pageContent');
  const emps = appData.employees;
  const months = getAvailableMonths().slice().reverse(); // 按时间从早到晚
  
  // 计算每个员工每个月的得分
  const empScores = emps.map(emp => {
    const monthly = {};
    let totalScore = 0, doneMonths = 0;
    months.forEach(m => {
      const calc = calcEmpScore(emp, m);
      const status = getEmpStatus(emp, m);
      monthly[m] = { total: calc.total, done: status.all, selfTotal: calc.selfTotal, supTotal: calc.supTotal, dirTotal: calc.dirTotal };
      if (status.all) {
        totalScore += calc.total;
        doneMonths++;
      }
    });
    const avg = doneMonths > 0 ? totalScore / doneMonths : 0;
    return { emp, monthly, avg, doneMonths };
  });
  
  // 按部门分组
  const byDept = {};
  empScores.forEach(r => {
    if (!byDept[r.emp.dept]) byDept[r.emp.dept] = [];
    byDept[r.emp.dept].push(r);
  });
  
  // 部门统计（所有月份平均）
  const deptStats = {};
  empScores.forEach(r => {
    if (!deptStats[r.emp.dept]) deptStats[r.emp.dept] = { total: 0, done: 0 };
    if (r.doneMonths > 0) {
      deptStats[r.emp.dept].total += r.avg;
      deptStats[r.emp.dept].done++;
    }
  });
  
  const scoreColor = (s) => s >= 90 ? 'text-emerald-600' : s >= 70 ? 'text-blue-600' : s >= 60 ? 'text-amber-600' : 'text-rose-600';
  
  content.innerHTML = `
    <div class="grid grid-cols-5 gap-4 mb-6">
      ${Object.entries(deptStats).map(([dept, s]) => `
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100">
          <div class="text-sm text-slate-500">${dept}</div>
          <div class="text-2xl font-bold text-slate-800 mt-1">${s.done > 0 ? (s.total/s.done).toFixed(1) : '—'}</div>
          <div class="text-xs text-slate-400 mt-1">人均月均 · ${s.done}人有数据</div>
        </div>
      `).join('')}
    </div>
    
    <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="px-5 py-3 bg-slate-50 border-b border-slate-100 flex items-center justify-between">
        <h3 class="font-bold text-slate-800">全员月度总分趋势</h3>
        <span class="text-xs text-slate-400">从2026-08月起 · 仅显示已完成月份的分数</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-slate-500 border-b border-slate-100">
              <th class="text-left px-4 py-3 font-medium sticky left-0 bg-slate-50">姓名</th>
              <th class="text-left px-4 py-3 font-medium">部门</th>
              <th class="text-left px-4 py-3 font-medium">岗位</th>
              ${months.map(m => `<th class="text-center px-4 py-3 font-medium">${m}</th>`).join('')}
              <th class="text-center px-4 py-3 font-medium bg-blue-50">月均分</th>
            </tr>
          </thead>
          <tbody>
            ${Object.entries(byDept).map(([dept, list]) => `
              ${list.map((r, idx) => `
                <tr class="border-b border-slate-50 hover:bg-slate-50 transition">
                  <td class="px-4 py-3 font-medium text-slate-700 sticky left-0 bg-white">${r.emp.name}</td>
                  <td class="px-4 py-3 text-slate-500">${idx === 0 ? dept : ''}</td>
                  <td class="px-4 py-3 text-slate-500">${r.emp.position}</td>
                  ${months.map(m => {
                    const d = r.monthly[m];
                    return `<td class="px-4 py-3 text-center font-medium ${d.done ? scoreColor(d.total) : 'text-slate-300'}">${d.done ? d.total.toFixed(1) : '—'}</td>`;
                  }).join('')}
                  <td class="px-4 py-3 text-center font-bold bg-blue-50 ${r.doneMonths > 0 ? scoreColor(r.avg) : 'text-slate-300'}">${r.doneMonths > 0 ? r.avg.toFixed(1) : '—'}</td>
                </tr>
              `).join('')}
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
    
    <div class="mt-4 text-xs text-slate-400">
      说明：表格中"—"表示该月考核尚未全部完成；月均分仅统计已完成月份的平均分。
    </div>
  `;
}

function addEmployee() {
  const name = prompt('请输入员工姓名：');
  if (!name) return;
  const dept = prompt('请输入部门（如：市场部、内容部、电商部、电商仓、设计部）：');
  if (!dept) return;
  const position = prompt('请输入岗位：');
  if (!position) return;
  const templateKey = dept + '_' + position;
  const newId = 'emp' + String(appData.employees.length + 1).padStart(3, '0');
  appData.employees.push({ id: newId, name, dept, position, templateKey });
  saveData();
  renderPage();
}

function editEmployee(empId) {
  const emp = appData.employees.find(e => e.id === empId);
  const name = prompt('姓名：', emp.name);
  if (name === null) return;
  const dept = prompt('部门：', emp.dept);
  if (dept === null) return;
  const position = prompt('岗位：', emp.position);
  if (position === null) return;
  emp.name = name;
  emp.dept = dept;
  emp.position = position;
  emp.templateKey = dept + '_' + position;
  saveData();
  renderPage();
}

function deleteEmployee(empId) {
  if (!confirm('确定删除该员工？其历史评分数据也会被删除。')) return;
  appData.employees = appData.employees.filter(e => e.id !== empId);
  Object.keys(appData.monthlyData).forEach(m => {
    delete appData.monthlyData[m][empId];
  });
  saveData();
  renderPage();
}

  viewingVersionIdx = idx;

function addTemplateVersion() {
  const key = viewingTemplateKey;
  const t = appData.templates[key];
  const latest = t.versions[t.versions.length - 1];
  const newVersion = 'v' + (t.versions.length + 1);
  
  // 简单弹窗输入生效月份和变更说明
  const effectiveMonth = prompt('请输入新版本生效月份（格式：2026-10）：', '2026-10');
  if (!effectiveMonth) return;
  const note = prompt('请输入版本变更说明：', '调整考核内容');
  if (!note) return;
  
  // 复制最新版本作为基础
  const newVer = JSON.parse(JSON.stringify(latest));
  newVer.version = newVersion;
  newVer.effectiveMonth = effectiveMonth;
  newVer.note = note;
  t.versions.push(newVer);
  
  // 按生效月份排序
  t.versions.sort((a, b) => a.effectiveMonth.localeCompare(b.effectiveMonth));
  // 重新编号版本号
  t.versions.forEach((v, i) => v.version = 'v' + (i + 1));
  
  saveData();
  viewingVersionIdx = t.versions.length - 1;
  renderTemplateModal();
  renderTemplates();
}

      <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100">
        <h3 class="font-bold text-rose-600 mb-2">危险操作</h3>
        <p class="text-sm text-slate-500 mb-4">清空所有评分数据（保留员工和模板），或重置全部数据为初始状态。</p>
        <div class="flex gap-2">
          <button onclick="clearScores()" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-sm transition">清空所有评分</button>
          <button onclick="resetAll()" class="px-4 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-lg text-sm transition">重置全部数据</button>
        </div>
      </div>
      
      <div class="mt-6 p-4 bg-blue-50 rounded-lg text-sm text-blue-700">
        <b>使用提示：</b>数据保存在浏览器本地存储中。建议每月导出一次JSON备份，防止浏览器清理缓存导致数据丢失。换电脑使用时，导出备份后在新电脑上导入即可。
      </div>
    </div>
  `;
}

function exportData() {
  const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '雪豹绩效数据备份_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.employees && data.templates) {
        appData = data;
        if (!appData.monthlyData) appData.monthlyData = {};
        saveData();
        alert('导入成功！');
        renderPage();
      } else {
        alert('文件格式不正确');
      }
    } catch(err) {
      alert('导入失败：' + err.message);
    }
  };
  reader.readAsText(file);
}

function clearScores() {
  if (!confirm('确定清空所有月份的评分数据？员工和模板会保留。')) return;
  appData.monthlyData = {};
  saveData();
  renderPage();
}

function resetAll() {
  if (!confirm('确定重置全部数据？这会恢复到初始状态，所有员工修改和评分都会丢失！')) return;
  appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
  appData.monthlyData = {};
  saveData();
  renderPage();
}

// ============ 初始化 ============
loadData();
initMonths();
renderPage();
</script>
</body>
